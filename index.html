<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Rehan Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0a0f2c, #001f3f);
  color: white;
}

/* CONTAINER FULL HP */
.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

/* BOX PREMIUM */
.payment-box {
  background: rgba(0,0,0,0.6);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 25px gold;
  border: 1px solid gold;
}

/* TITLE */
.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: gold;
  margin-bottom: 15px;
}

/* ITEM */
.item {
  margin: 15px 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #00c3ff;
  background: rgba(0,0,0,0.5);
}

/* QRIS */
.qris-img {
  width: 100%;
  border-radius: 10px;
}

/* BUTTON */
.btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  color: white;
  background: linear-gradient(45deg, gold, orange);
  border: none;
}

/* BUTTON BLUE */
.btn-blue {
  background: linear-gradient(45deg, #00c3ff, #0044ff);
}

/* HOVER */
.btn:hover {
  opacity: 0.8;
}

/* RESPONSIVE FIX */
@media(max-width: 500px){
  .title {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="payment-box">

    <div class="title">💳 METODE PEMBAYARAN</div>

    <!-- QRIS -->
    <div class="item">
      <b>QRIS</b><br><br>
      <img src="https://i.ibb.co/0R5xh3Xr/qris.png" class="qris-img">

      <a href="https://i.ibb.co/0R5xh3Xr/qris.png" download class="btn">
        Download QRIS
      </a>
    </div>

    <!-- DANA -->
    <div class="item">
      <b>DANA</b><br>
      <span id="dana">08984800635</span>

      <button class="btn-blue btn" onclick="copyText('dana')">
        Salin Nomor DANA
      </button>
    </div>

    <!-- GOPAY -->
    <div class="item">
      <b>GOPAY</b><br>
      <span id="gopay">08984800635</span>

      <button class="btn-blue btn" onclick="copyText('gopay')">
        Salin Nomor GOPAY
      </button>
    </div>

    <!-- SEABANK -->
    <div class="item">
      <b>SeaBank</b><br>
      No: 901844329174<br>
      A/N: Nur H*****h

      <button class="btn-blue btn" onclick="copyManual('901844329174')">
        Salin Rekening
      </button>
    </div>

    <!-- BUTTON -->
    <a href="https://wa.me/62895410354446" class="btn">
      Chat Admin
    </a>

    <a href="https://whatsapp.com/channel/0029VbCRYOf6WaKs1OfaGP22" class="btn-blue btn">
      Saluran WhatsApp
    </a>

    <a href="https://rehan-prjct.vercel.app" class="btn">
      Order Sekarang
    </a>

  </div>
</div>

<script>
function copyText(id){
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Berhasil disalin: " + text);
}

function copyManual(text){
  navigator.clipboard.writeText(text);
  alert("Berhasil disalin: " + text);
}
</script>

</body>
</html>
