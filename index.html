<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Rehan Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0a0f2c, #001f3f);
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

.payment-box {
  background: rgba(0,0,0,0.6);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 25px gold;
  border: 1px solid gold;
}

.title {
  text-align: center;
  font-size: 20px;
  color: gold;
  margin-bottom: 15px;
}

.item {
  margin: 12px 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #00c3ff;
  background: rgba(0,0,0,0.5);
  text-align: center;
}

/* QR */
.qris-img {
  width: 100%;
  max-height: 250px;
  object-fit: contain;
  border-radius: 10px;
}

/* GRID BUTTON */
.btn-group {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  color: white;
  background: linear-gradient(45deg, gold, orange);
  border: none;
}

.btn-blue {
  background: linear-gradient(45deg, #00c3ff, #0044ff);
}

.btn:hover {
  opacity: 0.85;
}
</style>
</head>

<body>

<div class="container">
  <div class="payment-box">

    <div class="title">💳 METODE PEMBAYARAN</div>

    <!-- QRIS -->
    <div class="item">
      <b>QRIS</b><br><br>

      <img src="https://files.catbox.moe/33ytv4.jpg" class="qris-img" id="qris">

      <div class="btn-group">
        <button class="btn" onclick="downloadQR()">Download</button>
      </div>
    </div>

    <!-- DANA -->
    <div class="item">
      <b>DANA</b><br>
      <span id="dana">08984800635</span>

      <div class="btn-group">
        <button class="btn-blue btn" onclick="copyText('dana')">Salin</button>
      </div>
    </div>

    <!-- GOPAY -->
    <div class="item">
      <b>GOPAY</b><br>
      <span id="gopay">08984800635</span>

      <div class="btn-group">
        <button class="btn-blue btn" onclick="copyText('gopay')">Salin</button>
      </div>
    </div>

    <!-- SEABANK -->
    <div class="item">
      <b>SeaBank</b><br>
      901844329174<br>
      A/N: Nur H*****h

      <div class="btn-group">
        <button class="btn-blue btn" onclick="copyManual('901844329174')">Salin</button>
      </div>
    </div>

    <!-- BUTTON UTAMA -->
    <div class="item">
      <div class="btn-group">
        <a href="https://wa.me/62895410354446" class="btn">Admin</a>
        <a href="https://whatsapp.com/channel/0029VbCRYOf6WaKs1OfaGP22" class="btn-blue btn">Channel</a>
        <a href="https://rehan-prjct.vercel.app" class="btn">Order</a>
      </div>
    </div>

  </div>
</div>

<script>
function copyText(id){
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Tersalin: " + text);
}

function copyManual(text){
  navigator.clipboard.writeText(text);
  alert("Tersalin: " + text);
}

/* DOWNLOAD QR KE GALERI */
function downloadQR() {
  const link = document.createElement('a');
  link.href = document.getElementById('qris').src;
  link.download = 'QRIS-RehanStore.jpg';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
